components:
  parameters:
    CampaignId:
      name: X-Campaign-Id
      in: header
      required: true
      schema: { type: string }
    ViewpointId:
      name: X-Viewpoint-Id
      in: header
      required: true
      schema: { type: string }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16 }

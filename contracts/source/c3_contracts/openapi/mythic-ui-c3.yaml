    get:
      operationId: getConnectivityState
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/ViewpointId' }
      responses:
        '200':
          description: Viewpoint-safe read model
          content:
            application/json:
              schema:
                $ref: '../schemas/read-models/async-attention-recovery.schema.json#/$defs/ConnectivityState'
  /recovery/{recordId}:
